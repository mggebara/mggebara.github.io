  <!-- ============================== PHOTOS ============================== -->
  <!-- EDIT: put your pictures in the photos/ folder, then update src, href,
       and alt (a short description, for screen readers) for each <figure>.
       - One photo per row: copy a whole <figure class="photo"> ... </figure> block.
       - The side-by-side row is the <div class="pair"> block; cut and paste
         that whole block to move it anywhere in the album. -->
  <section id="photos">
    <h2>Photo album</h2>
    <p class="hint">click any photo to see it full size</p>
    <div class="album">

      <figure class="photo">
        <a href="photos/sunflower.jpg"><img src="photos/sunflower.jpg" alt="A sunflower against a deep blue sky, with the sun flaring behind a fence" loading="lazy"></a>
      </figure>

      <figure class="photo">
        <a href="photos/stars.jpg"><img src="photos/stars.jpg" alt="A starry night sky between two dark mountain silhouettes" loading="lazy"></a>
      </figure>

      <figure class="photo">
        <a href="photos/trees.jpg"><img src="photos/trees.jpg" alt="Sunlight breaking through a stand of tall conifers" loading="lazy"></a>
      </figure>

      <!-- the one row with two pictures side by side -->
      <div class="pair">
        <figure class="photo">
          <a href="photos/crow-1.jpg"><img src="photos/crow-1.jpg" alt="A crow perched on a curved branch, looking at the camera" loading="lazy"></a>
        </figure>
        <figure class="photo">
          <a href="photos/crow-2.jpg"><img src="photos/crow-2.jpg" alt="The same crow on the same branch, beak open mid-call" loading="lazy"></a>
        </figure>
      </div>

      <figure class="photo">
        <a href="photos/cat.jpg"><img src="photos/cat.jpg" alt="A black cat stretched out on a brick garden border, seen from above" loading="lazy"></a>
      </figure>

      <figure class="photo">
        <a href="photos/fog.jpg"><img src="photos/fog.jpg" alt="Low sun and haze behind pine branches, with a white house in the corner" loading="lazy"></a>
      </figure>

    </div>
  </section>
